# Standalone kitty config DIRECTORY for the floating Yazi window (Phoenix Cmd-;).
# Launched via:  KITTY_CONFIG_DIRECTORY=<this dir> kitty yazi ~
#
# Living in its own config directory (rather than a single --config file) so
# kitty picks up the kitty.app.icns / kitty.app.png in THIS folder as the
# dock icon (a ">" with a cat), separate from the normal kitty icon.
# It does NOT include or affect the main ~/.dotfiles/kitty/kitty.conf.
#
# No --title flag is passed, so yazi drives the window title ("Yazi: <dir>"),
# which updates live as you navigate directories.

# Window appearance
remember_window_size       no
initial_window_width       120c
initial_window_height      40c

# Show the native window frame: title bar (shows yazi's "Yazi: <dir>" title)
# plus border, rounded corners, and shadow.
hide_window_decorations    no
background_opacity         0.95
dynamic_background_opacity yes

# Performance & features
enable_audio_bell          no

# Fully quit this kitty instance when its window is closed, so it doesn't
# linger in the dock as a windowless process.
macos_quit_when_last_window_closed yes

# Remote control over a dedicated socket, so Phoenix can find & focus THIS
# floating window specifically (terminal yazi sessions look identical by title,
# but they don't have this socket). kitty appends "-<pid>" to the path.
allow_remote_control yes
listen_on unix:/tmp/kitty-yazi-float

# Shell integration
shell_integration          enabled
