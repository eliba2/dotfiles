# Standalone kitty config DIRECTORY for the floating ktcal window (Phoenix Cmd-;).
# Launched via:  KITTY_CONFIG_DIRECTORY=<this dir> kitty --title ktcal ktcal
#
# Same idea as ../yazi-float: its own config directory so kitty picks up the
# kitty.app.icns / kitty.app.png in THIS folder as the dock icon (the cat with a
# calendar), and it does NOT include or affect the main ~/.dotfiles/kitty/kitty.conf.
# No theme files: ktcal draws its own truecolor UI, designed for kitty's dark default.

# Window appearance
remember_window_size       no
initial_window_width       120c
initial_window_height      40c

hide_window_decorations    no
background_opacity         0.95
dynamic_background_opacity yes

enable_audio_bell          no

# ktcal runs as the window's only program, so `q` closes the window; quit this
# kitty instance with it so it doesn't linger in the dock.
macos_quit_when_last_window_closed yes

# Remote control over a dedicated socket, so Phoenix can find & focus THIS
# window specifically. kitty appends "-<pid>" to the path.
allow_remote_control yes
listen_on unix:/tmp/kitty-ktcal-float
